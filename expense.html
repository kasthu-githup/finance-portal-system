<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Management</title>
    <link rel="stylesheet" href="expense.css">
</head>

<body>

<div class="container">

    <header class="page-header">
        <div>
            <h1>Expense Management</h1>
            <p>Add and monitor your expense records.</p>
        </div>

        <a href="index.html" class="dashboard-btn">
            ← Dashboard
        </a>
    </header>

    <!-- ADD EXPENSE -->
    <section class="card">

        <h2>Add Expense</h2>

        <form id="expenseForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Expense Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Office Rent"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Amount</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input
                        type="date"
                        id="expense_date"
                    >
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="">Select Category</option>
                        <option value="Office">Office</option>
                        <option value="Travel">Travel</option>
                        <option value="Salary">Salary</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Description</label>
                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Enter expense description"
                    ></textarea>
                </div>

            </div>

            <button type="submit">
                Add Expense
            </button>

        </form>

        <div id="message"></div>

    </section>

    <!-- EXPENSE LIST -->
    <section class="card">

        <div class="list-header">

            <div>
                <h2>Expense Records</h2>
                <p>All expense records from PostgreSQL database.</p>
            </div>

            <div class="total-box">
                <span>Total Expenses</span>
                <strong id="totalExpense">₹0</strong>
            </div>

        </div>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="expenseTableBody"></tbody>

            </table>

        </div>

    </section>

</div>

<script src="expense.js"></script>

</body>
</html>
